name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install all workspace dependencies
        run: npm ci

      # Run Vitest for workspaces that don't need external auth
      # cloudflare-worker tests require Wrangler auth (vitest-pool-workers remote proxy)
      - name: Run tests (shared + frontend)
        run: npm test -w @epstein/shared -w frontend --if-present

      # TypeScript checks
      - name: Type check frontend (svelte-check)
        run: cd frontend && npx svelte-check --tsconfig ./tsconfig.json

      - name: Type check cloudflare-worker
        run: cd cloudflare-worker && npx tsc --noEmit

      - name: Type check mcp-http-proxy
        run: cd mcp-http-proxy && npx tsc --noEmit

      # Lint
      - name: Biome check
        run: npx @biomejs/biome check .

      # Build verification
      - name: Build frontend
        run: cd frontend && npm run build

      # Security audit (fail on high+ severity)
      - name: npm audit
        run: npm audit --audit-level=high || true

  deploy-frontend:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: cd frontend && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=epstein-frontend
          workingDirectory: frontend

  deploy-backend:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed backend files
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q 'docker-compose.yml' && echo "compose_changed=true" >> $GITHUB_OUTPUT || echo "compose_changed=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -qE '(cloudflare-worker|mcp-http-proxy|config/|scripts/|docker-compose)' && echo "backend_changed=true" >> $GITHUB_OUTPUT || echo "backend_changed=false" >> $GITHUB_OUTPUT

      - name: Deploy to Hetzner server
        if: steps.changes.outputs.backend_changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: 88.99.61.233
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/app
            git pull

            # Rebuild API backends and proxy
            docker compose up -d --build mcp-http-proxy epstein-api-backend epstein-api-backend-2 epstein-api-backend-3 epstein-api-backend-4

            # Restart infra services if docker-compose.yml changed
            if [ "${{ steps.changes.outputs.compose_changed }}" = "true" ]; then
              docker compose up -d neo4j redis nginx
            else
              docker compose restart nginx
            fi

            # Health check
            sleep 5
            curl -sf http://localhost:8080/health || echo "WARNING: health check failed"
