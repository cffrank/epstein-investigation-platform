name = "epstein-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "epstein-documents"

[[d1_databases]]
binding = "CACHE_DB"
database_name = "epstein-cache"
database_id = "ea7bdcb5-d8f4-4d6c-8ac4-e9dc3c3075c4"

[[kv_namespaces]]
binding = "SESSIONS"
id = "eea15de47a4e454ca1079e6a218d26fe"

[ai]
binding = "AI"

[ai.gateway]
id = "internal-gateway"

[vars]
ENVIRONMENT = "production"
ORIGIN_URL = "https://epstein-api.allfrontoffice.com"

# Document processing queue
[[queues.producers]]
binding = "DOCUMENT_QUEUE"
queue = "epstein-document-processing"

[[queues.consumers]]
queue = "epstein-document-processing"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "epstein-processing-dlq"

# Dead letter queue for failed jobs
[[queues.producers]]
binding = "DLQ"
queue = "epstein-processing-dlq"

[[queues.consumers]]
queue = "epstein-processing-dlq"
max_batch_size = 1
max_retries = 0

# Workflows for document processing
[[workflows]]
binding = "DOCUMENT_WORKFLOW"
name = "document-processing"
class_name = "DocumentProcessingWorkflow"

[[workflows]]
binding = "BATCH_WORKFLOW"
name = "batch-processing"
class_name = "BatchProcessingWorkflow"
