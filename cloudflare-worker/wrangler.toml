name = "epstein-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "epstein-documents"

[[d1_databases]]
binding = "CACHE_DB"
database_name = "epstein-cache"
database_id = "ea7bdcb5-d8f4-4d6c-8ac4-e9dc3c3075c4"

[[kv_namespaces]]
binding = "SESSIONS"
id = "eea15de47a4e454ca1079e6a218d26fe"

[ai]
binding = "AI"

[ai.gateway]
id = "internal-gateway"

[vars]
ENVIRONMENT = "production"
ORIGIN_URL = "https://epstein-api.allfrontoffice.com"
