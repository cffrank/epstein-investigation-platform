  # ===================
  # R2 UPLOADER
  # Uploads PDFs to Cloudflare R2 with verification
  # DOES NOT delete local files - safe mode only
  # ===================
  r2-uploader:
    build:
      context: ./processing/r2-uploader
      dockerfile: Dockerfile
    container_name: r2-uploader
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-epstein-documents}
      BATCH_SIZE: 50
      WORKER_ID: 1
    volumes:
      - /opt/app/data/epstein-files:/data:ro
      - /opt/app/downloads:/downloads:ro
    networks:
      - app_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 1G

