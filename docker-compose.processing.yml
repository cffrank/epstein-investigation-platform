          memory: 1G

  # ===================
  # ENTITY RESOLUTION
  # Deduplicates Neo4j entities using Jaro-Winkler similarity
  # Syncs resolved entities to PostgreSQL
  # Run with: docker compose -f docker-compose.processing.yml run entity-resolution
  # ===================
  entity-resolution:
    build:
      context: ./processing/entity-resolution
      dockerfile: Dockerfile
    container_name: entity-resolution
    restart: "no"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    networks:
      - app_network
    depends_on:
      - postgres
      - neo4j
    deploy:
      resources:
        limits:
          memory: 4G

  # ===================
  # INVESTIGATION AGENT
  # Autonomous investigation of the document corpus
  # Uses tiered AI: Workers AI (bulk) / Sonnet (reasoning) / Opus (deep)
  # Run with: docker compose -f docker-compose.processing.yml run -it investigation-agent
  # ===================
  investigation-agent:
    build:
      context: ./processing/investigation-agent
      dockerfile: Dockerfile
    container_name: investigation-agent
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: document_embeddings_v2
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WORKERS_AI_URL: https://epstein-api.carl-f-frank.workers.dev
      WORKERS_AI_API_KEY: ${API_SECRET_KEY}
      WORKERS_AI_MODEL: "@cf/meta/llama-4-scout-17b-16e-instruct"
      CLAUDE_SONNET_MODEL: "claude-sonnet-4-20250514"
      CLAUDE_OPUS_MODEL: "claude-opus-4-20250514"
      HETZNER_S3_ENDPOINT: ${HETZNER_S3_ENDPOINT}
      HETZNER_S3_ACCESS_KEY: ${HETZNER_S3_ACCESS_KEY}
      HETZNER_S3_SECRET_KEY: ${HETZNER_S3_SECRET_KEY}
      HETZNER_S3_BUCKET: ${HETZNER_S3_BUCKET:-epstein-documents}
      HETZNER_S3_REGION: ${HETZNER_S3_REGION:-fsn1}
      S3_REPORTS_PREFIX: "reports/"
    networks:
      - app_network
    depends_on:
      - postgres
      - qdrant
      - neo4j
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
