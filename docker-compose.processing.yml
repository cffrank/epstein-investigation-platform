version: '3.8'

# Document Processing Pipeline - Separate compose file for processing containers
# Run with: docker-compose -f docker-compose.yml -f docker-compose.processing.yml up -d

networks:
  app_network:
    external: true
    name: app_app_network

services:
  # ===================
  # TEXT EXTRACTOR
  # Extracts text from PDFs using pdftotext, stores in PostgreSQL
  # ===================
  text-extractor:
    build:
      context: ./processing/text-extractor
      dockerfile: Dockerfile
    container_name: text-extractor
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      BATCH_SIZE: 100
      PARALLEL_DOWNLOADS: 10
      WORKER_ID: 1
      WORKER_URL: ${WORKER_URL:-https://epstein-api.carl-f-frank.workers.dev}
      API_SECRET_KEY: ${API_SECRET_KEY}
      ENABLE_R2_FETCH: "true"
      ENABLE_HETZNER_FETCH: "true"
      HETZNER_S3_ENDPOINT: ${HETZNER_S3_ENDPOINT}
      HETZNER_S3_ACCESS_KEY: ${HETZNER_S3_ACCESS_KEY}
      HETZNER_S3_SECRET_KEY: ${HETZNER_S3_SECRET_KEY}
      HETZNER_S3_BUCKET: ${HETZNER_S3_BUCKET:-epstein-documents}
    volumes:
      - /opt/app/data/epstein-files:/data:ro
      - /opt/app/downloads:/downloads:ro
    networks:
      - app_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

