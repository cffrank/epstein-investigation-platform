  # ===================
  # EMBEDDING GENERATOR
  # Generates embeddings via OpenAI text-embedding-3-small (1536 dimensions)
  # Uses chunking for long documents, batch API for efficiency
  # ===================
  embedding-generator:
    build:
      context: ./processing/embedding-generator
      dockerfile: Dockerfile
    container_name: embedding-generator
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: document_embeddings_v2
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: text-embedding-3-small
      BATCH_SIZE: 50
      CHUNK_SIZE: 6000
      CHUNK_OVERLAP: 500
      MAX_CHUNKS_PER_DOC: 20
      REQUESTS_PER_MINUTE: 5000
      WORKER_ID: 1
    networks:
      - app_network
    depends_on:
      - postgres
      - qdrant
    deploy:
      resources:
        limits:
          memory: 1G

